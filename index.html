<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Movers — Pip Calculator</title>
<style>
  :root{--black:#000;--white:#fff;--gray:#777;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Arial}
  body{background:var(--white);color:var(--black);}
  header{background:var(--white);border-bottom:1px solid #eee;padding:16px 24px;display:flex;align-items:center;}
  .logo{font-weight:900;font-size:20px;}
  main{max-width:500px;margin:40px auto;padding:20px;display:flex;flex-direction:column;gap:16px;}
  label{font-weight:600;margin-bottom:4px;}
  input,select,button{width:100%;padding:12px;border:1.5px solid #ccc;border-radius:10px;font-size:15px;}
  input:focus,select:focus{border-color:var(--black);outline:none;}
  select{appearance:none;background-image:
    linear-gradient(45deg,transparent 50%,var(--black) 50%),
    linear-gradient(135deg,var(--black) 50%,transparent 50%);
    background-position:calc(100% - 20px) center,calc(100% - 15px) center;
    background-size:6px 6px; background-repeat:no-repeat;}
  .btn{background:var(--black);color:var(--white);border:none;border-radius:10px;font-weight:700;cursor:pointer;padding:14px;}
  .btn:hover{opacity:0.9;}
  .results{border:1px dashed #ccc;border-radius:10px;padding:16px;margin-top:10px;}
  .stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;}
  .stat:last-child{border:none;}
  .big{font-weight:800;}
  footer{text-align:center;font-size:12px;color:var(--gray);margin:40px 0;}
</style>
</head>
<body>
<header><div class="logo">Market Movers</div></header>

<main>
  <label>Pair</label>
  <select id="pair">
    <option value="EURUSD">EUR/USD</option><option value="GBPUSD">GBP/USD</option>
    <option value="USDJPY">USD/JPY</option><option value="USDCHF">USD/CHF</option>
    <option value="AUDUSD">AUD/USD</option><option value="USDCAD">USD/CAD</option>
    <option value="NZDUSD">NZD/USD</option><option value="EURJPY">EUR/JPY</option>
  </select>

  <label>Price</label>
  <input id="price" type="number" step="0.00001" placeholder="1.0856">

  <label>Lot Size</label>
  <select id="lot">
    <option value="100000">Standard</option><option value="10000">Mini</option>
    <option value="1000">Micro</option><option value="custom">Custom</option>
  </select>
  <input id="units" type="number" placeholder="Units" style="display:none">

  <label>Account Currency</label>
  <select id="account">
    <option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option>
  </select>

  <label>Conversion (1 quote → account)</label>
  <input id="conv" type="number" step="0.00001" placeholder="blank if same">

  <label>Account Size</label>
  <input id="acctSize" type="number" placeholder="5000">

  <label>Risk %</label>
  <input id="riskPct" type="number" step="0.1" placeholder="1">

  <label>Stop (pips)</label>
  <input id="stop" type="number" step="0.1" placeholder="20">

  <button id="calc" class="btn">Calculate</button>

  <div id="res" class="results" style="display:none;">
    <div class="stat"><span>Pip Value</span><span class="big" id="pipVal">$0.00</span></div>
    <div class="stat"><span>Per-Unit</span><span class="big" id="pipUnit">$0.00</span></div>
    <div class="stat"><span>Risk $</span><span class="big" id="riskAmt">$0.00</span></div>
    <div class="stat"><span>Units</span><span class="big" id="suggest">—</span></div>
  </div>
</main>

<footer>© 2025 Market Movers</footer>

<script>
const $=id=>document.getElementById(id);
$('lot').onchange=()=>{$('units').style.display=$('lot').value==='custom'?'block':'none';};
$('calc').onclick=()=>{
  const pair=$('pair').value,price=parseFloat($('price').value);
  let units=$('lot').value==='custom'?parseFloat($('units').value):parseFloat($('lot').value);
  const acct=$('account').value,conv=parseFloat($('conv').value);
  const acctSize=parseFloat($('acctSize').value),riskPct=parseFloat($('riskPct').value),stop=parseFloat($('stop').value);
  if(!isFinite(price)||!isFinite(units)||!isFinite(acctSize)||!isFinite(riskPct)||!isFinite(stop))return;
  const quote=pair.slice(3,6),pip=quote==='JPY'?0.01:0.0001,f=isFinite(conv)?conv:1;
  const pipPerUnit=pip*f,pipValue=units*pipPerUnit;
  const riskAmt=(riskPct/100)*acctSize;
  const suggest=Math.floor(riskAmt/(pipPerUnit*stop));
  $('pipVal').textContent=pipValue.toLocaleString('en-US',{style:'currency',currency:acct});
  $('pipUnit').textContent=pipPerUnit.toLocaleString('en-US',{style:'currency',currency:acct});
  $('riskAmt').textContent=riskAmt.toLocaleString('en-US',{style:'currency',currency:acct});
  $('suggest').textContent=isFinite(suggest)?suggest.toLocaleString('en-US'):'—';
  $('res').style.display='block';
};
</script>
</body>
</html>
